version: '3.8'

services:
  # Backend API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hypothecation-backend
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - PORT=8080
    networks:
      - hypothecation-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8080/warryworks/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  # Frontend UI Service
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_MODE=production
        - NEXT_PUBLIC_API_URL=http://backend:8080
    container_name: hypothecation-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_MODE=production
      - NEXT_PUBLIC_API_URL=http://backend:8080
      - NEXT_PUBLIC_APP_NAME=MS EXIMP Hypothecation Management
      - NEXT_PUBLIC_APP_VERSION=2.0.0
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - hypothecation-network
    restart: unless-stopped

networks:
  hypothecation-network:
    driver: bridge
